name: Build and verify zudo-doc
description: Credential-free source, content, asset, and built Cloudflare Worker validation

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        node-version: '22'
    - name: Set up pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: '10.28.1'
    - name: Install frozen documentation and viewer dependencies
      shell: bash
      run: |
        pnpm --dir doc install --frozen-lockfile
        npm ci --prefix artwork-resources/pcb-art/preview-source
    - name: Check source, inventory, and generated content
      shell: bash
      working-directory: doc
      run: |
        pnpm check:content
        pnpm check:accessories
        node --test scripts/check-links.test.mjs scripts/old-host-redirect.test.mjs scripts/reconcile-history.test.mjs scripts/check-printable-accessories.test.mjs
        pnpm check
        pnpm check:links -- --strict-broken --strict-absolute --strict-anchors
        pnpm exec zfb wind audit --project-root . --fail-on error
    - name: Build Worker and history
      shell: bash
      working-directory: doc
      env:
        NODE_ENV: production
        NODE_OPTIONS: --max-old-space-size=4096
        GEN_DOC_HISTORY: '1'
      run: pnpm build
    - name: Check built links, images, viewers, and redirects
      shell: bash
      working-directory: doc
      run: |
        pnpm check:links -- --strict-broken --strict-absolute --strict-anchors
        pnpm check:images
        pnpm check:viewers
        pnpm check:redirects
        pnpm check:history
    - name: Verify Wrangler package and local built-Worker responses
      shell: bash
      working-directory: doc
      env:
        CI: 'true'
        WRANGLER_SEND_METRICS: 'false'
      run: |
        pnpm exec wrangler deploy --dry-run --outdir /tmp/zudo-blanks-worker-dry-run
        pnpm check:worker
    - name: Verify built Worker navigation and viewers in Chromium
      shell: bash
      working-directory: doc
      env:
        CI: 'true'
        WRANGLER_SEND_METRICS: 'false'
        BROWSER_OUTPUT: /tmp/blanks-browser
      run: |
        pnpm exec wrangler dev --local --port 8787 > /tmp/zudo-blanks-browser-worker.log 2>&1 &
        browser_worker_pid=$!
        trap 'kill "$browser_worker_pid" 2>/dev/null || true; wait "$browser_worker_pid" 2>/dev/null || true' EXIT
        browser_worker_ready=false
        for attempt in $(seq 1 60); do
          if curl --silent --fail http://127.0.0.1:8787/ > /dev/null; then
            browser_worker_ready=true
            break
          fi
          if ! kill -0 "$browser_worker_pid" 2>/dev/null; then
            cat /tmp/zudo-blanks-browser-worker.log
            exit 1
          fi
          sleep 1
        done
        if [ "$browser_worker_ready" != true ]; then
          cat /tmp/zudo-blanks-browser-worker.log
          exit 1
        fi
        pnpm check:browser
