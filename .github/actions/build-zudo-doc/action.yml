name: 'Build zudo-doc Application'
description: 'Setup environment, run quality checks, and build zudo-doc site'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  pnpm-version:
    description: 'pnpm version to use'
    required: false
    default: '10'
  working-directory:
    description: 'Working directory containing the zudo-doc project'
    required: false
    default: 'doc'

outputs:
  build-output-path:
    description: 'Path to the build output directory'
    value: 'dist'

runs:
  using: 'composite'
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: ${{ inputs.pnpm-version }}

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'pnpm'
        cache-dependency-path: '${{ inputs.working-directory }}/pnpm-lock.yaml'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Run code quality checks
      run: |
        echo "🔍 Running code quality checks..."
        pnpm check
        pnpm check:links -- --strict-absolute --strict-anchors
        echo "✅ Code quality checks passed"
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Build zudo-doc
      run: pnpm build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        NODE_ENV: production
        NODE_OPTIONS: '--max-old-space-size=4096'

    - name: Verify build output
      run: |
        echo "📦 Build Output Verification"
        echo "============================"

        if [ ! -d "dist" ]; then
          echo "❌ Error: dist/ directory not found"
          exit 1
        fi

        # Count output files
        HTML_COUNT=$(find dist -name "*.html" | wc -l)
        echo "📄 HTML files: $HTML_COUNT"

        if [ -d "dist/assets" ]; then
          echo "✅ zudo-doc assets found"
        else
          echo "⚠️ Warning: assets/ directory not found (might be ok for minimal builds)"
        fi

        echo "============================"
        echo "✅ Build output verified"
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Check built links
      run: pnpm check:links -- --strict-broken --strict-absolute --strict-anchors
      shell: bash
      working-directory: ${{ inputs.working-directory }}
